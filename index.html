<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Manager - Đăng Nhập</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <h2> Checklist Manager</h2>
    <p class="subtitle">Đăng nhập để quản lý công việc của bạn</p>

    <div class="input-group">
        <input type="text" id="username" placeholder="Tên đăng nhập" autocomplete="off">
    </div>
    
    <div class="input-group">
        <input type="password" id="password" placeholder="Mật khẩu">
    </div>

    <div class="btn-group">
        <button class="btn-login" onclick="login()">Đăng Nhập</button>
        <button class="btn-register" onclick="register()">Đăng Ký</button>
    </div>

    <p id="message"></p>
</div>

<script src="js/auth.js"></script>
</body>
</html>
